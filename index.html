body::before{
  content:'';
  position:fixed;inset:0;
  background: rgba(4, 10, 16, 0.72);
  pointer-events:none;
  z-index:0;
}

.top-bar{
  position:sticky;top:0;z-index:100;
  height:72px;
  background: rgba(5,12,20,0.9);
  border-bottom: 2px solid #68d928;
  backdrop-filter: blur(16px);
  display:flex;align-items:center;padding:0 32px;
  gap:16px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 1px 0 rgba(104,217,40,0.1);
}
.top-bar img{height:44px;object-fit:contain}
.top-bar .divider{width:1px;height:24px;background:rgba(104,217,40,0.2)}
.top-bar .page-label{
  font-family:'Rajdhani',sans-serif;
  font-size:15px;font-weight:600;
  color: var(--text-dim);
  letter-spacing:1.5px;text-transform:uppercase;
}

.container{max-width:1400px;margin:40px auto;padding:0 24px;position:relative;z-index:1}

/* CARD FORM */
.card{
  background: rgba(255,255,255,0.96);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius:16px;
  padding:36px 40px;
  margin-bottom:28px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}

.section-title{
  font-family:'Rajdhani',sans-serif;
  font-size:26px;font-weight:700;
  color: #68d928;
  letter-spacing:1px;
  margin-bottom:4px;
}
.section-sub{font-size:14px;color:#6b7280;margin-bottom:28px}

.form-group{margin-bottom:18px}
label{
  display:block;font-size:12px;font-weight:600;
  margin-bottom:8px;color:#3d6b2a;
  letter-spacing:.8px;text-transform:uppercase;
}
input,select{
  width:100%;padding:13px 16px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:15px;font-family:'DM Sans',sans-serif;
  background: #f9fafb;
  color: #1f2937;
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:#9ca3af}
select option{background:#f9fafb;color:#1f2937}
input:focus,select:focus{
  outline:none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(104,217,40,0.12);
}

.row{display:flex;gap:14px}
.row .col{flex:1}

.buttons{margin-top:6px;display:flex;gap:12px}
.btn-primary{
  background: var(--green);
  color: #060e04;
  padding:13px 28px;border:none;border-radius:10px;
  font-family:'Rajdhani',sans-serif;
  font-weight:700;font-size:17px;letter-spacing:.5px;
  cursor:pointer;
  transition:background .2s,transform .1s,box-shadow .2s;
  display:flex;align-items:center;gap:8px;
  box-shadow: 0 0 20px rgba(104,217,40,0.3);
}
.btn-primary:hover{
  background:#7ae030;
  box-shadow: 0 0 30px rgba(104,217,40,0.5);
}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  padding:13px 22px;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:600;color:#6b7280;
  transition:background .2s,color .2s;
}
.btn-secondary:hover{background:#e5e7eb;color:#374151}

/* RESULTS HEADER */
.results-header{
  display:flex;align-items:center;
  margin-bottom:16px;padding: 0 4px;
}
.results-count{
  font-family:'Rajdhani',sans-serif;
  font-size:16px;color:var(--text-dim);letter-spacing:.5px;
}
.results-count strong{
  color:var(--green);font-size:24px;margin-right:6px;
}

/* GRID */
.clients-grid{display:flex;flex-direction:column;gap:14px}

/* CLIENT CARD */
.client-card{
  background: rgba(255,255,255,0.97);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:14px;overflow:hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  transition:transform .2s,box-shadow .2s,border-color .2s;
  animation:slideIn .35s ease both;
}
.client-card:hover{
  transform:translateY(-2px);
  border-color: rgba(104,217,40,0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(104,217,40,0.08);
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

.client-card-header{
  padding:20px 26px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid #e5e7eb;
  background: linear-gradient(90deg, #68d928 0%, #1a2e0a 100%);
}
.client-card-header h3{
  font-family:'Rajdhani',sans-serif;
  font-size:20px;font-weight:700;
  color:#fff;letter-spacing:.3px;margin-bottom:2px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.id-tag{
  font-size:13px;font-family:'DM Mono',monospace;
  color:rgba(0,0,0,0.5);
}
.status-badge{
  padding:6px 16px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.5px;
  flex-shrink:0;font-family:'DM Mono',monospace;
}
.status-ativo{
  background:rgba(80,170,20,0.85);
  color:#fff;
  border:1px solid rgba(104,217,40,0.6);
}
.status-inativo{
  background:rgba(180,20,20,0.85);
  color:#fff;
  border:1px solid rgba(220,38,38,0.6);
}

.client-card-address{
  padding:12px 26px 16px;
  border-top:1px solid #f0f0f0;
}
.client-card-body{
  padding:20px 26px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}
.info-label{
  font-size:11px;font-weight:700;
  color:#4a7a30;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;
}
.info-value{font-size:15px;color:#1f2937;font-weight:500}
.info-value.mono{font-family:'DM Mono',monospace;font-size:14px;color:#1f2937}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-dim);
}
.empty-state .icon{font-size:52px;margin-bottom:16px;opacity:.6}
.empty-state p{font-size:17px;font-weight:500;margin-bottom:8px}
.empty-state small{font-size:13px;opacity:.7}

.hidden{display:none !important}

/* LOADER */
.loading{
  text-align:center;padding:36px;color:var(--text-dim);
  font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:'DM Mono',monospace;letter-spacing:.5px;
}
.spinner{
  width:18px;height:18px;
  border:2px solid rgba(104,217,40,0.2);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .7s linear infinite;
  box-shadow: 0 0 8px rgba(104,217,40,0.3);
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top-bar">
  <img src="logo.png" alt="DBNET">
  <div class="divider"></div>
  <span class="page-label">Consulta de Cliente</span>
</div>

<div class="container">

  <div style="display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;">

    <div class="card" style="flex:1;min-width:260px;">
      <div class="section-title">🔍 Consulta de Cliente</div>
      <div class="section-sub">Selecione o tipo de dado e informe o valor para localizar o cliente no sistema.</div>

      <div class="form-group">
        <label>Tipo de busca</label>
        <select id="tipoBusca" onchange="alterarCampos()">
          <option value="idLead" selected>ID Lead</option>
        </select>
      </div>

      <div id="camposBusca"></div>

      <div class="buttons">
        <button class="btn-primary" onclick="buscarCliente()">
          <span>⚡</span> Buscar Cliente
        </button>
        <button class="btn-secondary" onclick="novaBusca()">↻ Nova Busca</button>
      </div>
    </div>

    <div id="painelInfo" class="card hidden" style="flex:1;min-width:260px;">
      <div class="section-title">📋 Dados da Pesquisa</div>
      <div id="infoConteudo"></div>
    </div>

  </div>

  <div id="loadingState" class="loading hidden">
    <div class="spinner"></div> Buscando clientes...
  </div>

  <div id="areaResultados" class="hidden">
    <div class="results-header">
      <div class="results-count">
        <strong id="countClientes">0</strong> cliente(s) encontrado(s)
      </div>
    </div>
    <div id="clientesGrid" class="clients-grid"></div>
  </div>

</div>

<script>
const cidadeMap = {
  "3572": "Lorena",
  "3414": "Cruzeiro",
  "3697": "Piquete",
  "3566": "Lavrinhas",
  "3379": "Canas",
  "3474": "Guaratinguetá",
  "3693": "Pindamonhangaba",
  "3736": "Queluz",
  "3763": "Roseira",
  "3363": "Cachoeira Paulista",
  "3293": "Aparecida"
}

function alterarCampos(){
  const tipo = document.getElementById("tipoBusca").value
  const container = document.getElementById("camposBusca")
  container.innerHTML = ""

  if(tipo === "endereco"){
    container.innerHTML = `
      <div class="row">
        <div class="col">
          <label>Cidade</label>
          <input type="text" id="cidade" placeholder="Ex: São Paulo">
        </div>
        <div class="col">
          <label>Número</label>
          <input type="text" id="numero" placeholder="Ex: 340">
        </div>
      </div>
      <div class="form-group">
        <label>Rua</label>
        <input type="text" id="rua" placeholder="Ex: Rua São Miguel">
      </div>
    `
  } else {
    const placeholders = {
      cpf: "000.000.000-00",
      nome: "Nome completo ou parcial",
      email: "exemplo@email.com",
      telefone: "(00) 00000-0000",
      idLead: "Informe o ID do lead"
    }
    const labels = {cpf:"CPF / CNPJ", nome:"Nome", email:"E-mail", telefone:"Telefone", idLead:"ID Lead"}

    container.innerHTML = `
      <div class="form-group">
        <label>${labels[tipo]}</label>
        <input type="text" id="valorBusca" placeholder="${placeholders[tipo]}">
      </div>
    `

    if(tipo === "telefone"){
      document.getElementById("valorBusca").addEventListener("input", function(e){
        let v = e.target.value.replace(/\D/g, "").substring(0, 11)
        if(v.length > 7) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3")
        else if(v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2")
        else if(v.length > 0) v = v.replace(/(\d{0,2})/, "($1")
        e.target.value = v
      })
    }

    if(tipo === "cpf"){
      document.getElementById("valorBusca").addEventListener("input", function(e){
        let v = e.target.value.replace(/\D/g, "").substring(0, 14)
        if(v.length <= 11){
          if(v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4")
          else if(v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3")
          else if(v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, "$1.$2")
          e.target.placeholder = "000.000.000-00"
        } else {
          if(v.length > 12) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, "$1.$2.$3/$4-$5")
          else if(v.length > 8) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{1,4})/, "$1.$2.$3/$4")
          else if(v.length > 5) v = v.replace(/(\d{2})(\d{3})(\d{1,3})/, "$1.$2.$3")
          else if(v.length > 2) v = v.replace(/(\d{2})(\d{1,3})/, "$1.$2")
          e.target.placeholder = "00.000.000/0000-00"
        }
        e.target.value = v
      })
    }
  }
}

async function buscarCliente(){
  const tipo = document.getElementById("tipoBusca").value
  let payload = { tipo: tipo, dados: {} }

  if(tipo === "endereco"){
    payload.dados = {
      cidade: document.getElementById("cidade").value,
      rua: document.getElementById("rua").value,
      numero: document.getElementById("numero").value
    }
  } else {
    payload.dados[tipo] = document.getElementById("valorBusca").value
  }

  document.getElementById("areaResultados").classList.remove("hidden")
  document.getElementById("loadingState").classList.remove("hidden")
  document.getElementById("clientesGrid").innerHTML = ""
  document.getElementById("countClientes").textContent = "..."

  try {
    const response = await fetch("http://10.100.125.80:5678/webhook/pesquisa-clientes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })

    const rawText = await response.text()
    document.getElementById("loadingState").classList.add("hidden")

    let data
    try { data = JSON.parse(rawText) }
    catch(parseErr) {
      document.getElementById("countClientes").textContent = "Erro"
      document.getElementById("clientesGrid").innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><p>Resposta inválida</p><small style="font-family:monospace;word-break:break-all">${rawText.substring(0,300)}</small></div>`
      return
    }

    const clientes = Array.isArray(data) ? data : (data.clientes || [])

    // Exibe painel de info
    const info = data.info && (Array.isArray(data.info) ? data.info[0] : data.info)
    if (info) {
      const cidade = cidadeMap[String(info.Id_cidade)] || info.Id_cidade || ""

      const html = `
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #e5e7eb;">
          <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">👤 Nome</div>
          <div style="font-size:18px;font-weight:700;color:#1f2937;">${escapeHtml(info.Nome || "—")}</div>
        </div>
        <div style="display:flex;gap:16px;">
          <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
            ${info.Cpf ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">#️⃣ CPF</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;font-family:monospace;">${escapeHtml(info.Cpf)}</div>
            </div>` : ""}
            ${info.Telefone ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">📞 Telefone</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;">${escapeHtml(info.Telefone)}</div>
            </div>` : ""}
            ${info.Email ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">📧 E-mail</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;">${escapeHtml(info.Email)}</div>
            </div>` : ""}
          </div>
          <div style="width:1px;background:#e5e7eb;flex-shrink:0;"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
            ${cidade ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">🏙️ Cidade</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;">${escapeHtml(cidade)}</div>
            </div>` : ""}
            ${info.Cep ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">📍 CEP</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;">${escapeHtml(info.Cep)}</div>
            </div>` : ""}
            ${info.Numero_casa ? `<div>
              <div style="font-size:11px;font-weight:700;color:#4a7a30;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;">🏠 Nº Casa</div>
              <div style="font-size:14px;font-weight:500;color:#1f2937;">${escapeHtml(info.Numero_casa)}</div>
            </div>` : ""}
          </div>
        </div>`
      document.getElementById("infoConteudo").innerHTML = html
      document.getElementById("painelInfo").classList.remove("hidden")
    }

    if(clientes.length > 0){
      renderClientes(clientes)
    } else {
      document.getElementById("countClientes").textContent = "0"
      document.getElementById("clientesGrid").innerHTML =
        `<div class="empty-state"><div class="icon">🔎</div><p>Nenhum cliente encontrado</p><small>Tente buscar com outros dados</small></div>`
    }

  } catch (error) {
    document.getElementById("loadingState").classList.add("hidden")
    document.getElementById("countClientes").textContent = "Erro"
    document.getElementById("clientesGrid").innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><p>Erro de conexão</p><small style="font-family:monospace">${String(error)}</small></div>`
    console.error("FETCH ERROR:", error)
  }
}

const CIDADES = {
  "3414": "Cruzeiro",
  "3572": "Lorena",
  "3697": "Piquete",
  "3566": "Lavrinhas",
  "3379": "Canas",
  "3474": "Guaratinguetá",
  "3693": "Pindamonhangaba",
  "3736": "Queluz",
  "3763": "Roseira",
  "3363": "Cachoeira Paulista",
  "3293": "Aparecida"
}

function renderClientes(clientes){
  document.getElementById("loadingState").classList.add("hidden")
  document.getElementById("countClientes").textContent = clientes.length

  const grid = document.getElementById("clientesGrid")
  grid.innerHTML = ""
  clientes.forEach((c, i) => {
    const ativo = c.statusCliente === "S"
    const card = document.createElement("div")
    card.className = "client-card"
    card.style.animationDelay = (i * 50) + "ms"

    const tel = c.telefoneCliente || null
    const email = c.emailCliente || null
    const cidade = CIDADES[String(c.cidadeCliente)] || c.cidadeCliente || null
    const endereco = [cidade, c.bairroCliente, c.ruaCliente, c.numeroCasa].filter(Boolean).join(", ") || null

    card.innerHTML = `
      <div class="client-card-header">
        <div class="name-block">
          <h3>${escapeHtml(c.nomeCompleto)}</h3>
          <div class="id-tag">ID #${c.idCliente}</div>
        </div>
        <div class="status-badge ${ativo ? 'status-ativo' : 'status-inativo'}">
          ${ativo ? '● ATIVO' : '● INATIVO'}
        </div>
      </div>
      <div class="client-card-body">
        <div class="info-item">
          <div class="info-label">CPF / CNPJ</div>
          <div class="info-value mono">${c.cpfCliente || '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Telefone</div>
          <div class="info-value">${tel ? escapeHtml(tel) : '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-label">E-mail</div>
          <div class="info-value">${email ? escapeHtml(email) : '—'}</div>
        </div>
      </div>
      <div class="client-card-address">
        <div class="info-label">Endereço</div>
        <div class="info-value">${endereco ? escapeHtml(endereco) : '—'}</div>
        ${c.cepCliente ? `<div class="info-value mono" style="margin-top:2px;font-size:13px;color:#6b7280;">CEP: ${escapeHtml(c.cepCliente)}</div>` : ''}
      </div>
    `
    grid.appendChild(card)
  })
}

function escapeHtml(str){
  if(!str) return ""
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
}

function novaBusca(){
  document.getElementById("areaResultados").classList.add("hidden")
  document.getElementById("clientesGrid").innerHTML = ""
  document.getElementById("painelInfo").classList.add("hidden")
  document.getElementById("infoConteudo").innerHTML = ""
}

alterarCampos()
</script>
</body>
</html>
